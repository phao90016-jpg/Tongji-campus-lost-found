name: 缺陷
description: 报告可复现的缺陷
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 以学生身份登录
        2. 对招领 12 提交认领申请
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附日志、截图或接口响应（注意脱敏，不要贴真实手机号/学工号）
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options: ["S1 阻塞（主流程不可用）", "S2 严重（核心功能错误）", "S3 一般", "S4 轻微"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options: ["认证与权限", "发布", "检索", "认领与审核", "交接码", "举报与信用", "通知", "统计", "部署/CI"]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: 本地 / CI / 部署环境 + 浏览器或 Python 版本
  - type: input
    id: req-id
    attributes:
      label: 关联需求或用例编号
      placeholder: 例如 REQ-F-016 / UC-18
